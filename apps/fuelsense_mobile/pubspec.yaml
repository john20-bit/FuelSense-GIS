name: fuelsense_mobile
description: "FuelSense AI - AI Powered Fuel Intelligence"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.0.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.0
  lottie: ^3.3.2
  intl: ^0.20.2
  iconsax_flutter: ^1.0.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  google_sign_in: ^7.0.0

  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/news/news_preview.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
