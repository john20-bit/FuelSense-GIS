apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuelsense-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: api.fuelsensegis.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fuelsense-api-gateway
                port:
                  number: 80
