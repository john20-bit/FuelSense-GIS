apiVersion: v1
kind: LimitRange
metadata:
  name: fuelsense-staging-limits
  namespace: fuelsense-staging
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: "250m"
        memory: 256Mi
      max:
        cpu: "4"
        memory: 4Gi
