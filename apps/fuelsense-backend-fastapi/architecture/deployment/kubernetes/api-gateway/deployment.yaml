apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuelsense-api-gateway
  labels:
    app: fuelsense-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fuelsense-api-gateway
  template:
    metadata:
      labels:
        app: fuelsense-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: fuelsense/api-gateway:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
